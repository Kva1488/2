name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Готовое приложение одним файлом
        uses: actions/upload-artifact@v4
        with:
          name: nebosvod
          path: dist/
